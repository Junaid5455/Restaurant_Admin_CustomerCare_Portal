version: '3.8'

services:
  # ====================================================
  # PostgreSQL Database
  # ====================================================
  db:
    image: postgres:15-alpine
    container_name: portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d restaurant_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================
  # Redis Cache & Message Broker
  # ====================================================
  redis:
    image: redis:7-alpine
    container_name: portal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================
  # Django Web Application
  # ====================================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: portal_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=portal_user
      - DB_PASSWORD=portal_password
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1

  # ====================================================
  # Celery Worker
  # ====================================================
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: portal_celery
    restart: unless-stopped
    command: celery -A restaurant_portal worker -l info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - web
      - redis
    environment:
      - DB_HOST=db
      - DB_USER=portal_user
      - DB_PASSWORD=portal_password
      - REDIS_URL=redis://redis:6379/0

  # ====================================================
  # Celery Beat (Scheduler)
  # ====================================================
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: portal_celery_beat
    restart: unless-stopped
    command: celery -A restaurant_portal beat -l info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - celery
    environment:
      - DB_HOST=db
      - DB_USER=portal_user
      - DB_PASSWORD=portal_password

  # ====================================================
  # Flower (Celery Monitoring)
  # ====================================================
  flower:
    image: mher/flower
    container_name: portal_flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/1 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - celery

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: