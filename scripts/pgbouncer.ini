; PgBouncer Configuration for Restaurant Portal
; Windows location: C:\pgbouncer\etc\pgbouncer.ini

[databases]
; Map the database name to the actual PostgreSQL database
restaurant_portal = host=localhost port=5432 dbname=restaurant_portal

[pgbouncer]
; Listen on all interfaces
listen = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = C:\pgbouncer\etc\userlist.txt

; Pooling mode: transaction is best for web applications
pool_mode = transaction

; Connection limits
max_client_conn = 1000
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
max_user_connections = 100

; Timeouts (in seconds)
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 30
query_wait_timeout = 120
client_idle_timeout = 0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60